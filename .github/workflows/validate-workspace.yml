name: Validate Metallic workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate

  extensions:
    name: ${{ matrix.extension }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension:
          - ai-chat-utilities
          - frame-meter
          - tab-finder
          - tube-utilities
          - workspace-forge
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npx vitest run --pool=forks --maxWorkers=1
