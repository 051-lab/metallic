name: Validate Metallic workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  workspace:
    name: Workspace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate

  extensions:
    name: ${{ matrix.extension }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension:
          - ai-chat-utilities
          - frame-meter
          - tab-finder
          - tube-utilities
          - workspace-forge
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npx vitest run --pool=forks --maxWorkers=1
      - name: Commit Workspace Forge bundles
        if: matrix.extension == 'workspace-forge' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/workspace-forge/dist
          if git diff --cached --quiet; then
            echo "Workspace Forge bundles are current."
          else
            git commit -m "build(workspace-forge): refresh runtime bundles"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload Workspace Forge build
        if: matrix.extension == 'workspace-forge'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-forge-dist
          path: extensions/workspace-forge/dist
          if-no-files-found: error
